name: Arcana
options:
  bundleIdPrefix: com.arcana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # <- set your team in Xcode's Signing & Capabilities tab
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  Arcana:
    type: application
    platform: iOS
    sources:
      - path: Arcana
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        # Change this to something unique to you, e.g. com.isa.arcana
        PRODUCT_BUNDLE_IDENTIFIER: com.arcana.app
        INFOPLIST_FILE: Arcana/Resources/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# ---------------------------------------------------------------------------
# Widgets, App Groups and Sign in with Apple need a PAID Apple Developer
# account. They're disabled here so the app installs on a free/personal team.
#
# To re-enable on a paid account:
#   1. Uncomment the `entitlements` block below and the ArcanaWidgets target.
#   2. Add `- target: ArcanaWidgets` to the Arcana `dependencies` list.
#   3. Add `CODE_SIGN_ENTITLEMENTS: Arcana/Resources/Arcana.entitlements` to
#      the Arcana `settings.base`.
#   4. Re-run `xcodegen generate`.
#
#    entitlements:
#      path: Arcana/Resources/Arcana.entitlements
#      properties:
#        com.apple.security.application-groups:
#          - group.com.arcana.shared
#        com.apple.developer.applesignin:
#          - Default
#
#  ArcanaWidgets:
#    type: app-extension
#    platform: iOS
#    sources:
#      - path: ArcanaWidgets
#    settings:
#      base:
#        PRODUCT_BUNDLE_IDENTIFIER: com.arcana.app.widgets
#        INFOPLIST_FILE: ArcanaWidgets/Info.plist
#        CODE_SIGN_ENTITLEMENTS: ArcanaWidgets/ArcanaWidgets.entitlements
#    entitlements:
#      path: ArcanaWidgets/ArcanaWidgets.entitlements
#      properties:
